<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Goosse Toast – Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <!-- Goosse Toast CSS -->
    <link rel="stylesheet" href="toast.css">
</head>

<body class="p-4">

<div class="container">
    <h1 class="mb-4">Goosse Toast – Demo</h1>

    <p class="text-muted">
        Demonstration of the Goosse Toast module using plain JavaScript
        and Bootstrap 5.
    </p>

    <div class="mt-4">
        <h5 class="mb-2">Basic toasts</h5>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-info" id="btn-info">Info</button>
            <button class="btn btn-success" id="btn-success">Success</button>
            <button class="btn btn-warning" id="btn-warning">Warning</button>
            <button class="btn btn-danger" id="btn-danger">Danger</button>
        </div>

        <h5 class="mb-2">Progress & interaction</h5>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-secondary" id="btn-progress">
                Progress (click to pause)
            </button>
        </div>

        <h5 class="mb-2">Positions</h5>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-primary" id="btn-top-left">Top left</button>
            <button class="btn btn-outline-primary" id="btn-middle-left">Middle left</button>
            <button class="btn btn-outline-primary" id="btn-bottom-left">Bottom left</button>

            <button class="btn btn-outline-primary" id="btn-top-right">Top right</button>
            <button class="btn btn-outline-primary" id="btn-middle-right">Middle right</button>
            <button class="btn btn-outline-primary" id="btn-bottom-right">Bottom right</button>

            <button class="btn btn-outline-dark" id="btn-center">Center</button>
        </div>


        <h5 class="mt-4 mb-2">HTML content</h5>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-outline-success" id="btn-html-message">
                HTML in message
            </button>
            <button class="btn btn-outline-primary" id="btn-html-title-message">
                HTML in title + message
            </button>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Goosse Toast JS -->
<script src="toast.js"></script>

<!-- Demo logic -->
<script src="demo.js"></script>

</body>
</html>
